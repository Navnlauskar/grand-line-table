<title>Sheet Table</title><meta name="description" content="Character sheets and dice for a table with a human DM: One Piece or plain D&D 5e.">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="p2p.js"></script></head><body><div id="app"></div>
<style>:root{--bg:#12161c;--card:#1b222b;--card2:#232c37;--line:#33404f;--ink:#eef2f6;--mute:#9aa8b8;--acc:#f0b35a;--accink:#1c1304;--grn:#3fae6b;--red:#e06055;--blu:#5aa2f0;--gold:#f0b35a;--r:14px}
@media (prefers-color-scheme:light){:root{--bg:#f3f1ec;--card:#fff;--card2:#f6f3ee;--line:#d8d2c6;--ink:#1d2228;--mute:#5d6875;--acc:#b86a12;--accink:#fff;--grn:#23824a;--red:#c0392b;--blu:#1f6fc4;--gold:#b86a12}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:1100px;margin:0 auto;padding:0 12px calc(86px + env(safe-area-inset-bottom,0px))}
h1{font-size:21px;margin:0;line-height:1.2}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px;font-weight:700}h2 small{text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
small{color:var(--mute);font-size:12.5px}p{margin:6px 0}
.hint{color:var(--mute);font-size:13.5px}.hintbox{background:var(--card2);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--mute);margin:8px 0}.hintbox b{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;min-height:44px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--acc)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}.btn.red{border-color:var(--red);color:var(--red)}.btn.grn{border-color:var(--grn);color:var(--grn)}
.btn.sm{min-height:38px;padding:6px 11px;font-size:14px}.btn.xs{min-height:32px;min-width:32px;padding:2px 8px;font-size:14px}.btn.big{width:100%;min-height:52px;font-size:17px;margin-top:16px}
.btn.armed{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.row>input,.row>select{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;background:var(--bg)}
.advsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.advsw button{min-height:36px;padding:4px 13px;border:0;background:transparent;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer}
.advsw button.on{background:var(--card2);color:var(--ink)}.advsw button.on[data-k="1"]{background:var(--grn);color:#fff}.advsw button.on[data-k="-1"]{background:var(--red);color:#fff}
.net{font-size:12.5px;color:var(--mute);background:transparent;border:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.net.bad{color:var(--red);font-weight:700;cursor:pointer;min-height:36px}
.hero{display:flex;gap:12px;align-items:center;padding:8px 0 12px}.hn{flex:1;min-width:0}.hn h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:var(--mute);font-size:14px}
.av{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:700;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pages.wide{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.hp .hpn,.hpn{display:flex;align-items:baseline;gap:8px}.hpn b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}.hpn span{color:var(--mute);font-size:17px}.hpn.sm b{font-size:28px}.hpn .mini{margin-left:auto;font-size:12.5px}
.hp.low .hpn b{color:var(--gold)}.hp.down .hpn b,.down .hpn b{color:var(--red)}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--grn);border-radius:99px;transition:width .3s}.low .bar i{background:var(--gold)}.down .bar i{background:var(--red)}
.hpr{margin-top:10px}.hpr input{flex:1 1 70px;text-align:center;font-size:18px;font-weight:700}
.rest{margin-top:10px;flex-wrap:wrap}.rest .hd{flex:1 1 100%;font-size:13.5px;color:var(--mute)}
.death{margin-top:10px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--red) 16%,transparent);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-style:normal;color:var(--ink)}
button.chip{cursor:pointer}.chip.tog.on,.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}.chip.cond{border-color:var(--red);color:var(--red)}.chip.ok{border-color:var(--grn);color:var(--grn)}.chip.bad{border-color:var(--red);color:var(--red)}
.chips{flex-wrap:wrap;margin:12px 0 0}.chipsel{width:auto;min-height:34px;padding:2px 8px;border-radius:999px;font-size:13.5px}.chipset{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;color:var(--ink)}.st b{display:block;font-size:20px}.st span{font-size:10.5px;color:var(--mute);line-height:1.15;display:block}
.st.tap{cursor:pointer;border-color:var(--acc)}
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ab{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;cursor:pointer;color:var(--ink);display:block}.ab small{display:block;font-weight:700;letter-spacing:.08em}.ab b{display:block;font-size:26px;line-height:1.1}.ab span{font-size:12.5px;color:var(--mute)}
.abil.build .ab{cursor:default}.abil.build select,.abil.build input{margin:4px 0;text-align:center;padding:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{display:grid;gap:8px}
.rb{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.rb span{min-width:0}.rb small{margin-left:6px}.rb b{font-size:18px;font-variant-numeric:tabular-nums}.rb.p{border-left:5px solid var(--grn)}.rb.x{border-left:5px solid var(--gold)}.rb:active{background:var(--card2)}
.atk{display:flex;gap:8px;align-items:stretch}.atk .rb{flex:1}.atk .rb small{display:block;margin:0}.btn.dmg{border-color:var(--red);color:var(--red);min-width:84px}
.resrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.resrow>span:first-child{flex:1;min-width:0}
.pips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.pip{width:28px;height:28px;border-radius:50%;border:2px solid var(--acc);background:transparent;cursor:pointer;padding:0}.pip.on{background:var(--acc)}
.ctr{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.spell,.item{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}.spell>div:first-child,.item>span:first-child{flex:1;min-width:0}.spell p{margin:2px 0 0;color:var(--mute);font-size:13.5px}.item small{display:block}
.fruit{margin-top:8px}.fruit .spell{margin-top:8px;background:var(--card2)}
.feats details,.feats>p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}.feats summary{cursor:pointer;font-weight:600}.feats details p{color:var(--mute);margin:6px 0 0}
details.add{margin:10px 0}details.add>summary{cursor:pointer;color:var(--acc);font-weight:600;min-height:40px;display:flex;align-items:center}
.form{display:grid;gap:8px;margin-top:8px}.form.inline{grid-template-columns:1fr 70px auto}.form.inline:has(input:nth-of-type(3)){grid-template-columns:1fr 64px}.form.inline:has(input:nth-of-type(3)) input:nth-of-type(3){grid-column:1}.form.ovr{grid-template-columns:1fr 1fr}.form.ovr label{font-size:13.5px}
.money{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.money>span{font-size:26px}.money>b{font-size:26px;flex:1}.money .row{flex:1 1 100%}
.party{display:grid;gap:8px}.pm{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}.pm>div{flex:1;min-width:0}.pm small{display:block}.pm .bar{margin:4px 0 0;height:6px}.pm.off{opacity:.55}.pmhp{font-weight:700;font-variant-numeric:tabular-nums}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.log{display:grid;gap:6px}.lg{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}.lg small{display:block}.lg>span{font-size:20px;font-weight:700}.lg.note{color:var(--mute);font-size:13.5px;background:transparent;border-style:dashed}.lg.crit{border-color:var(--gold)}.lg.crit>span{color:var(--gold)}.lg.fum>span{color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;min-height:58px;border:0;background:transparent;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px}.nav i{font-style:normal;font-size:19px}.nav button.on{color:var(--acc);font-weight:700}
.req{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 18%,var(--card));border:1px solid var(--acc);margin-bottom:8px}
.inits{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;overflow:hidden}.inits.mine{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 40%,transparent)}
.rd{font-weight:700;white-space:nowrap}.ord{display:flex;gap:6px;overflow-x:auto;flex:1}.ord span{white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--card2);font-size:13.5px}.ord span.cur{background:var(--acc);color:var(--accink);font-weight:700}.ord span.foe{border:1px solid var(--red)}
.builder{padding-bottom:20px}.fl{display:block;margin:12px 0 0;font-size:13.5px;color:var(--mute)}.fl input,.fl select{margin-top:4px}.ck{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:14.5px}
.errs{background:color-mix(in srgb,var(--red) 16%,transparent);border:1px solid var(--red);border-radius:12px;padding:8px 12px;margin-top:12px}
.pick2{display:grid;gap:10px}.tapc{text-align:left;cursor:pointer;color:var(--ink)}.tapc b{font-size:18px}.tapc p{color:var(--mute)}
.dmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}.pc.off{opacity:.6}.pch{display:flex;gap:10px;align-items:center;margin-bottom:8px}.pch>div{flex:1;min-width:0}.pch small{display:block}
.orow{display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap}.olist{max-width:760px}.orow.cur{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 40%,transparent)}.orow.foe{border-left:5px solid var(--red)}.orow.pc{border-left:5px solid var(--blu)}.orow.down{opacity:.55}
.orow .iv{width:54px;flex:none;text-align:center;font-weight:700;padding:4px}.orow .on{flex:1;min-width:90px}.orow .on small{display:block}.orow input[id^=oN_]{width:58px;flex:none;text-align:center;padding:4px}.ohp{font-weight:700;font-variant-numeric:tabular-nums}
.dmopen{margin-bottom:6px}
.toast{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:92vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.35);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
#rollCard{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:50;width:min(94vw,420px);background:var(--card);border:2px solid var(--acc);border-radius:18px;padding:14px 18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:transform .22s;visibility:hidden}
#rollCard.show{transform:translate(-50%,0);visibility:visible}#rollCard.crit{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 35%,transparent),0 12px 40px rgba(0,0,0,.45)}#rollCard.fumble{border-color:var(--red)}
.rc-l{font-size:14px;color:var(--mute)}.rc-t{font-size:56px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}.rc-d{font-size:13.5px;color:var(--mute)}.rc-f{display:flex;gap:8px;justify-content:center;margin-top:10px}.rc-x{position:absolute;right:6px;top:4px;width:36px;height:36px;border:0;background:transparent;color:var(--mute);font-size:16px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){.abil{grid-template-columns:repeat(6,1fr)}.pick2{grid-template-columns:1fr 1fr}.builder{max-width:640px;margin:0 auto}.pages:not(.wide):not(.dm){max-width:640px;margin:0 auto}}
@media print{.top,.nav,.btn,details.add,#rollCard,.toast,.req,.inits,.chipsel,.hpr{display:none!important}body{background:#fff;color:#000}#app{max-width:none;padding:0}.pg{break-inside:avoid-page;margin-bottom:12px}.card,.rb,.st,.ab,.spell,.item{border-color:#999;background:#fff;color:#000}.feats details{break-inside:avoid}}
#netBadge{display:none!important}

/* ---------- shared hooks the skins use ---------- */
@font-face{font-family:'Pirata One';src:url(fonts/pirata-one-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IM Fell English';src:url(fonts/im-fell-english-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Crimson Pro';font-weight:400;src:url(fonts/crimson-pro-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Crimson Pro';font-weight:700;src:url(fonts/crimson-pro-latin-700-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Rye';src:url(fonts/rye-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Special Elite';src:url(fonts/special-elite-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Alfa Slab One';src:url(fonts/alfa-slab-one-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Cinzel';font-weight:400;src:url(fonts/cinzel-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Cinzel';font-weight:700;src:url(fonts/cinzel-latin-700-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Bangers';src:url(fonts/bangers-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Comic Neue';font-weight:400;src:url(fonts/comic-neue-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Comic Neue';font-weight:700;src:url(fonts/comic-neue-latin-700-normal.woff2) format('woff2');font-display:swap}
:root{--fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fh:var(--fb);--bgimg:none;--hw:800;--shadow:none;--bw:1px}
body{font-family:var(--fb);background-image:var(--bgimg);background-attachment:fixed}
h1,.hpn b,.rc-t,.st b,.ab b,.th-h,.th-hp b,.rd,.tapc b,.money>b{font-family:var(--fh);font-weight:var(--hw)}
.card,.rb,.st,.ab,.spell,.item,.pm,.lg,.feats details,.feats>p,.inits,.btn,input,select,textarea,.chip{border-width:var(--bw);box-shadow:var(--shadow)}
.lg.note,.chip,.pip,input,select,textarea{box-shadow:none}
.top{background:var(--topbg,var(--bg))}
.nav button.on,details.add>summary{color:var(--acctext,var(--acc))}
.form.inline2{grid-template-columns:1fr auto;margin-top:8px}
.form.mon{grid-template-columns:repeat(3,1fr);background:var(--card2);border-radius:var(--r);padding:10px;margin-top:8px}.form.mon>input:first-child{grid-column:1/-1}.form.mon>input[id^=cmD_]{grid-column:span 2}.form.mon .ck{grid-column:span 2;margin:0}.form.mon .btn{grid-column:1/-1}
.feats details.done{opacity:.6}.feats details .fl:first-of-type{margin-top:8px}
.lg.note.read{font-style:italic;color:var(--ink);border-style:solid;border-left:5px solid var(--acc);background:var(--card);font-size:15px}
/* ---------- the look picker ---------- */
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (min-width:700px){.thgrid{grid-template-columns:repeat(3,1fr)}}
.thprev{--bw:1px;--shadow:none;--hw:800}.thprev[data-theme=plain]{--bg:#12161c;--card:#1b222b;--card2:#232c37;--line:#33404f;--ink:#eef2f6;--mute:#9aa8b8;--acc:#f0b35a;--accink:#1c1304;--grn:#3fae6b;--red:#e06055;--blu:#5aa2f0;--r:14px;--bgimg:none;--fb:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fh:var(--fb)}@media (prefers-color-scheme:light){.thprev[data-theme=plain]{--bg:#f3f1ec;--card:#fff;--card2:#f6f3ee;--line:#d8d2c6;--ink:#1d2228;--mute:#5d6875;--acc:#b86a12;--accink:#fff;--grn:#23824a;--red:#c0392b;--blu:#1f6fc4}}
.thprev{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:var(--r);border:var(--bw) solid var(--line);background-color:var(--bg);background-image:var(--bgimg);color:var(--ink);font-family:var(--fb);cursor:pointer;min-height:190px;box-shadow:var(--shadow)}
.thprev.sel{outline:4px solid var(--blu);outline-offset:3px}
.th-h{font-size:21px;line-height:1.1}.th-hp{color:var(--mute);font-size:13px}.th-hp b{font-size:26px;color:var(--ink)}
.th-bar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden;display:block}.th-bar i{display:block;width:79%;height:100%;background:var(--grn)}
.th-row{display:flex;gap:6px;flex-wrap:wrap}.th-btn{background:var(--acc);color:var(--accink);border-radius:calc(var(--r) - 4px);padding:5px 9px;font-weight:700;font-size:13px;border:var(--bw) solid var(--line)}
.th-chip{background:var(--card);border:var(--bw) solid var(--line);border-radius:calc(var(--r) - 4px);padding:5px 9px;font-size:13px}.th-d{font-size:12.5px;color:var(--mute);margin-top:auto}

/* ---------- 1. Sea Chart: parchment, ink and red wax ---------- */
[data-theme=chart]{--bg:#eadcbd;--card:#f6ecd4;--card2:#e6d6b2;--line:#b89f6f;--ink:#2a1f14;--mute:#6b573d;--acc:#8c2a1c;--accink:#fff4e0;--acctext:#8c2a1c;--grn:#3f6b3a;--red:#a3271a;--blu:#2d5d7c;--gold:#a8741a;--r:6px;
  --fb:'Crimson Pro',Georgia,serif;--fh:'IM Fell English','Crimson Pro',Georgia,serif;--hw:400;
  --bgimg:radial-gradient(ellipse at 15% 10%,rgba(120,84,36,.16),transparent 45%),radial-gradient(ellipse at 90% 85%,rgba(120,84,36,.2),transparent 50%),radial-gradient(circle at 60% 40%,rgba(255,250,235,.5),transparent 60%);--shadow:0 1px 0 rgba(90,60,20,.25)}
html[data-theme=chart] body{font-size:17.5px}html[data-theme=chart] h2{font-family:var(--fh);text-transform:none;letter-spacing:0;font-size:19px;color:var(--acc);font-weight:400;border-bottom:1px solid var(--line);padding-bottom:2px}

function validateBuild(b){const errs=[];const cl=CLASSES[b.cls];const sp=SPECIES[b.species];const sub=sp.subs?sp.subs[b.sub]:null;
  if(!String(b.name||'').trim())errs.push('Give your character a name.');
  if(sp.subs&&!sub)errs.push('Pick a '+sp.name+' subrace.');
  const {picks}=asiOf(b);for(let i=0;i<picks.length;i++)if(!(b.asiPicks||[])[i])errs.push('Choose where your species\' ability increase goes.');
  if(new Set((b.asiPicks||[]).slice(0,picks.length)).size<picks.length)errs.push('Species increases must go to different abilities.');
  if(sub&&sub.skillPick&&!b.speciesPick)errs.push('Choose your '+sub.name+' skill.');
  if((b.classSkills||[]).length!==cl.pick)errs.push(`Choose ${cl.pick} ${cl.name} skills.`);
  if((b.bgSkills||[]).length!==2)errs.push('Choose 2 background skills.');
  if(cl.expertise&&(b.expertise||[]).length!==cl.expertise)errs.push(`Choose ${cl.expertise} Expertise skills.`);
  if(b.feat==='skilled'&&(b.featSkills||[]).length!==3)errs.push('Choose 3 skills for Skilled.');
  return errs}

function itemKeyByName(nm){const n=String(nm||'').toLowerCase().trim();for(const [k,it] of Object.entries(ITEMS))if(it.name.toLowerCase()===n)return k;for(const [k,it] of Object.entries(ITEMS))if(n&&(n.includes(it.name.toLowerCase())||it.name.toLowerCase().includes(n)))return k;return null}
function itemBonus(c){const out={atk:0,dmg:0,ac:0,magic:false,name:''};for(const it of invOf(c)){if(it.equipped===false)continue;const k=it.key||itemKeyByName(it.name);const b=k&&ITEMS[k]&&ITEMS[k].bonus;if(!b)continue;if(b.atk>out.atk){out.atk=b.atk;out.name=ITEMS[k].name}if(b.dmg>out.dmg)out.dmg=b.dmg;if(b.ac)out.ac+=b.ac;if(b.magic)out.magic=true}return out}
function usableItems(c){return invOf(c).map((it,i)=>({it,i,k:it.key||itemKeyByName(it.name)})).filter(x=>x.k&&ITEMS[x.k]&&ITEMS[x.k].use&&x.it.qty>0)}
// ---- area templates ----
function tplCells(shape,size,origin,aim){const r=Math.max(1,Math.round(size/5));const out=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let inside=false;
    if(shape==='burst'||shape==='self'||shape==='target'){const R=shape==='target'?0:r;inside=Math.max(Math.abs(x-origin.x),Math.abs(y-origin.y))<=R&&!(shape==='self'&&x===origin.x&&y===origin.y)}
    else{const dx=aim.x-origin.x,dy=aim.y-origin.y;const L=Math.hypot(dx,dy)||1;const ux=dx/L,uy=dy/L;const px=x-origin.x,py=y-origin.y;const along=px*ux+py*uy;const across=Math.abs(-px*uy+py*ux);
      if(shape==='cone')inside=along>0.5&&along<=r+0.5&&across<=along*0.5+0.5;
      if(shape==='line')inside=along>0.5&&along<=r+0.5&&across<=0.5}
    if(inside)out.push({x,y})}return out}
let PLACE=null;
function tokensIn(cells,kind){const set=new Set(cells.map(c=>c.x+','+c.y));return Object.entries(ST.tokens).filter(([,t])=>t.scene===ST.state.scene&&(!kind||t.kind===kind)&&set.has(t.x+','+t.y)).map(([id])=>id)}
function drawTpl(cells,ok,label){let g=$('tplFx');if(!g){g=document.createElement('div');g.id='tplFx';$('board').appendChild(g)}const s=CELL*ZOOM;
  g.innerHTML=cells.map(c=>`<i style="left:${c.x*s}px;top:${c.y*s}px;width:${s}px;height:${s}px" class="${ok?'':'bad'}"></i>`).join('')+(label?`<b style="left:${(cells[0]?cells[0].x:0)*s}px;top:${(cells[0]?cells[0].y:0)*s-22}px">${esc(label)}</b>`:'')}
function clearTpl(){const g=$('tplFx');if(g)g.remove()}
function startPlace(spec,onDone){const me=ST.tokens[myTokId()];if(!me)return;const a=spec.area;
  if(a.shape==='self'){const cells=tplCells('self',a.size,me,me);onDone(cells);return}
  PLACE={spec,onDone,me};$('board').classList.add('placing');toast(a.shape==='cone'||a.shape==='line'?'Point where to aim, then click (Esc cancels).':'Click where to place it (Esc cancels).');
  $('board').addEventListener('pointermove',placeMove);setTimeout(()=>$('board').addEventListener('click',placeClick,{once:false}),50)}
function placeAim(e){const p=cellFromEvent(e);const me=PLACE.me;const a=PLACE.spec.area;let ok=true;let origin=me,aim=p;
  if(a.shape==='burst'||a.shape==='target'){const rr=Math.round((a.range||30)/5);ok=cheb(me,p)<=rr&&canTarget(ST.state.scene,me,p);origin=p}
  return{cells:tplCells(a.shape,a.size,origin,aim),ok}}
function placeMove(e){if(!PLACE)return;const r=placeAim(e);drawTpl(r.cells,r.ok,PLACE.spec.name+(r.ok?'':' · out of range'))}
function placeClick(e){if(!PLACE)return;e.stopPropagation();const r=placeAim(e);if(!r.ok){toast('Out of range or out of sight.');return}const fn=PLACE.onDone;cancelPlace();drawTpl(r.cells,true,'');setTimeout(clearTpl,1500);fn(r.cells)}
function cancelPlace(){if(!PLACE)return;PLACE=null;$('board').classList.remove('placing');$('board').removeEventListener('pointermove',placeMove);$('board').removeEventListener('click',placeClick);clearTpl()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&PLACE){cancelPlace();toast('Cancelled.')}});
// ---- the buttons on your turn ----
function techUses(c,D,src){if(src.type==='fruit'){const fr=fruitOf(c);const mx=fr?fr.charges:FRUIT_CHARGES;return{left:mx-((c.res||{}).fruit||0),max:mx}}
  if(src.type==='haki'){const o=hakiOpt(src.key);const mx=hakiUses(o,D);return{left:mx-((c.res||{})['haki_'+src.key]||0),max:mx}}
  if(src.type==='item'){const it=invOf(c)[src.i];return{left:it?it.qty:0,max:it?it.qty:0}}return{left:0,max:0}}
function powerList(c,D){const L=[];const fr=fruitOf(c);if(fr&&(c.build.fruitAte||c.fruit))for(const t of fr.techs)L.push({id:'f_'+t.id,src:{type:'fruit'},spec:{...t,dc:fruitDC(D,c)},cost:t.cost,label:'🍇 '+t.name,cls:'fruitact'});
  for(const k of hakiOf(c)){const o=hakiOpt(k);if(!o||o.act==='passive')continue;L.push({id:'h_'+k,src:{type:'haki',key:k},spec:{...o,id:k,dc:hakiDC(o,D),cost:1},cost:1,label:HAKI[o.color].icon+' '+o.name,cls:'hakiact'})}
  for(const x of usableItems(c)){const it=ITEMS[x.k];L.push({id:'i_'+x.i,src:{type:'item',i:x.i},spec:{...it.use,name:it.name,desc:it.desc,dc:8+D.prof+Math.max(mod(D.ab.DEX),mod(D.ab.STR))},cost:1,label:'🎒 '+it.name,cls:'itemact'})}
  return L}
function powerActions(c,D,e,tok){return powerList(c,D).map(p=>{const s=p.spec;const u=techUses(c,D,p.src);const act=s.act||'action';const need=act==='action'?e.action<1:act==='bonus'?e.bonus<1:false;
  let dis=need||u.left<(p.src.type==='fruit'?p.cost:1);if(s.kind==='attack'&&!tok)dis=true;if(s.cond&&s.cond.blur&&c.cond&&c.cond.blur&&!s.cond.hidden)dis=true;if(s.econ&&s.econ.slide&&e.slide)dis=true;if(s.econ&&s.econ.blast&&e.blast)dis=true;if(s.cond&&s.cond.hardened&&c.cond&&c.cond.hardened)dis=true;
  const costTxt=p.src.type==='fruit'?(p.cost?`${p.cost} charge${p.cost>1?'s':''}`:'free'):p.src.type==='haki'?'Haki':'item';
  const leftTxt=p.src.type==='item'?`×${u.left}`:`${u.left}/${u.max} left`;
  return{id:'pw_'+p.id,k:`${act==='action'?'Action':act==='bonus'?'Bonus action':'Free'} · ${costTxt}`,b:p.label,s:`${s.desc} · ${leftTxt}${s.kind==='save'?` · DC ${s.dc}`:''}`,dis,fruit:true,cls:p.cls}})}
async function spendUse(c,D,p){const fresh=myChar();const res={...(fresh.res||{})};
  if(p.src.type==='fruit')res.fruit=(res.fruit||0)+p.cost;
  if(p.src.type==='haki')res['haki_'+p.src.key]=(res['haki_'+p.src.key]||0)+1;
  if(p.src.type==='item'){const inv=invOf(fresh).map(x=>({...x}));const it=inv[p.src.i];if(it)it.qty-=1;await put('chars/'+ST.me,{...fresh,res,inv:inv.filter(x=>x.qty>0)});return}
  await put('chars/'+ST.me,{...fresh,res})}
function evalTemp(f,c,D){if(!f)return 0;let v=0;for(const part of String(f).split('+')){const p=part.trim();if(/^\d+d\d+$/.test(p)){const [n,dd]=p.split('d').map(Number);v+=sum(Array.from({length:n},()=>d(dd)))}else if(p==='lvl')v+=D.lvl;else if(p==='conscore')v+=D.ab.CON;else if(p==='con2')v+=2*Math.max(0,mod(D.ab.CON))+2;else v+=+p||0}return v}
async function usePower(pid){const c=myChar();const D=derive(c.build);const p=powerList(c,D).find(x=>x.id===pid);if(!p)return;const s=p.spec;const e=econNow();const act=s.act||'action';
  const cost=act==='action'?{action:e.action-1}:act==='bonus'?{bonus:0}:{};const upd=patch=>put('table/econ',{...econNow(),...patch});
  if(s.kind==='attack'){if(strike('tech',{...s,name:s.name})){await spendUse(c,D,p);upd(cost);if(s.recoil){const r=evalTemp(s.recoil,c,D);const f=myChar();put('chars/'+ST.me,{...f,hp:Math.max(1,f.hp-r)});toast(`Recoil: you take ${r}.`)}}return}
  if(s.kind==='heal'){const h=sum(Array.from({length:s.n},()=>d(s.die)))+(s.plus||0);await spendUse(c,D,p);const f=myChar();const nh=Math.min(D.maxhp,Math.max(0,f.hp)+h);await put('chars/'+ST.me,{...f,hp:nh,...(nh>0?{death:{s:0,f:0},stable:false}:{})});upd(cost);addLog({by:ST.me,who:c.build.name,label:s.name,detail:`${s.n}d${s.die}+${s.plus||0}`,total:'+'+h,fx:{tg:myTokId(),k:'heal',n:h}});return}
  if(s.kind==='buff'){await spendUse(c,D,p);const f=myChar();const nc={...(f.cond||{}),...(s.cond||{})};let temp=f.temp||0;if(s.temp){temp=Math.max(temp,evalTemp(s.temp,c,D))}await put('chars/'+ST.me,{...f,cond:nc,temp});upd({...cost,...(s.econ||{}),...(s.econ&&s.econ.dash?{dash:(econNow().dash||0)+s.econ.dash}:{})});
    addLog({by:ST.me,who:c.build.name,label:s.name,detail:`${c.build.name}: ${s.desc}${temp&&s.temp?` (${temp} temporary HP)`:''}`,total:'✦',fx:{tg:myTokId(),k:'info',txt:s.name.toUpperCase()+'!'}});return}
  if(s.kind==='reveal'){await spendUse(c,D,p);upd(cost);sendAction({kind:'power',op:'reveal',by:ST.me,who:c.build.name,actor:myTokId(),label:s.name,range:12});return}
  if(s.kind==='conq'){await spendUse(c,D,p);upd(cost);sendAction({kind:'power',op:'conq',by:ST.me,who:c.build.name,actor:myTokId(),label:s.name,dc:s.dc,range:6});pop("CONQUEROR'S HAKI!");return}
  if(s.kind==='save'){startPlace(s,async cells=>{const tg=tokensIn(cells,'foe');await spendUse(c,D,p);upd(cost);
      if(!tg.length){addLog({by:ST.me,who:c.build.name,label:s.name,detail:`${c.build.name} uses ${s.name}, but no enemy is caught in it.`,total:'—'});return}
      sendAction({kind:'power',op:'save',by:ST.me,who:c.build.name,actor:myTokId(),targets:tg,dc:s.dc,save:s.save,n:s.n||0,die:s.die||0,dtype:s.dtype||'force',half:!!s.half,effect:s.effect||null,label:s.name,cells:cells.slice(0,80)})});return}}
// ---- host side ----
const FOE_SAVE=(ft,sv)=>{const boss=(ft.hp||0)>=30;const base=sv==='DEX'?(ft.dex||0):sv==='STR'?(ft.str??Math.max(1,ft.atk-3)):sv==='CON'?(boss?3:1):(boss?2:0);return base+(boss?2:0)};
async function hostPower(a){const who=String(a.who||'Someone').slice(0,40);const label=String(a.label||'Power').slice(0,40);
  if(a.op==='save'){const ls=[];let first=null;for(const id of (a.targets||[]).slice(0,10)){const f=ST.dm[id];const tk=ST.tokens[id];if(!f||f.hp<=0||!tk)continue;const ft=FOES[f.foe]||{};const r=d20roll(0);const tot=r.v+FOE_SAVE(ft,a.save);const ok=tot>=(+a.dc||10);
      let dmg=0;if(+a.n&&+a.die){dmg=sum(Array.from({length:Math.min(12,+a.n)},()=>d(Math.min(12,+a.die))));if(ok)dmg=a.half?Math.floor(dmg/2):0;if((ft.immune||[]).includes(a.dtype))dmg=0;else if((ft.resist||[]).includes(a.dtype))dmg=Math.floor(dmg/2)}
      const eff=!ok&&a.effect&&['prone','restrained','blinded','frightened','weakened'].includes(a.effect)?a.effect:null;
      if(dmg){const nh=Math.max(0,f.hp-dmg);await setFoeHp(id,nh);if(nh===0)setTimeout(()=>koFoe(id),900)}
      if(eff&&ST.tokens[id])await put('tokens/'+id,{...ST.tokens[id],[eff]:true});
      ls.push(`${f.name}: ${a.save} save ${tot} ${ok?'succeeds':'fails'}${dmg?`, ${dmg} ${a.dtype} damage`:''}${eff?`, ${eff}!`:''}.`);if(!first)first={id,dmg,eff}}
    if(ls.length)await addLog({by:a.by||'',who,label,detail:ls.join(' '),total:`DC ${+a.dc||10}`,fx:first?{a:a.actor,tg:first.id,k:first.dmg?'hit':'info',n:first.dmg,txt:first.eff?first.eff.toUpperCase()+'!':'saved',area:(a.cells||[]).slice(0,80)}:null});
    hostCombatCheck();return}
  if(a.op==='reveal'){const me=ST.tokens[a.actor];const found=[];for(const [id,f] of Object.entries(ST.dm)){if(f.type!=='foe'||!f.hidden||f.scene!==ST.state.scene||f.hp<=0)continue;if(me&&cheb(me,f)>(+a.range||12))continue;await revealFoe(id,true);found.push(f.name)}
    await addLog({by:a.by||'',who,label,detail:found.length?`${who} senses ${found.join(', ')}!`:`${who} reaches out with Haki... nobody is hiding nearby.`,total:'👁'});return}
  if(a.op==='conq'){const me=ST.tokens[a.actor];const ls=[];for(const [id,t] of Object.entries(ST.tokens)){if(t.kind!=='foe'||t.scene!==ST.state.scene||!me||cheb(me,t)>(+a.range||6))continue;const f=ST.dm[id];if(!f||f.hp<=0)continue;const ft=FOES[f.foe]||{};const r=d20roll(0);const tot=r.v+FOE_SAVE(ft,'WIS');
      if(tot>=(+a.dc||12)){ls.push(`${f.name} withstands it (${tot}).`);continue}
      if(f.max<=12){await setFoeHp(id,0);setTimeout(()=>koFoe(id),900);ls.push(`${f.name} foams at the mouth and faints!`)}else{await put('tokens/'+id,{...ST.tokens[id],frightened:true});ls.push(`${f.name} trembles: frightened!`)}}
    await addLog({by:a.by||'',who,label,detail:ls.join(' ')||'No enemy close enough.',total:'👑',fx:{tg:a.actor,k:'info',txt:'HAKI!'}});hostCombatCheck();return}}

const ONE_TURN=['restrained','blinded','frightened','weakened'];
function foeDisadv(tk){return!!(tk&&(tk.restrained||tk.blinded||tk.frightened||tk.weakened))}
async function clearFoeTurnFx(id){const t=ST.tokens[id];if(!t)return;if(ONE_TURN.some(k=>t[k])){const n={...t};for(const k of ONE_TURN)delete n[k];await put('tokens/'+id,n)}}
function pcResists(c,dt){const fr=fruitOf(c);const cond=c.cond||{};if(fr&&(fr.immune||[]).includes(dt))return'immune';if(cond.raging&&['bludgeoning','piercing','slashing'].includes(dt))return'half';if(cond.resistAll&&['bludgeoning','piercing','slashing'].includes(dt))return'half';if(fr&&(fr.resist||[]).includes(dt))return'half';return null}
async function predictiveCounter(uid,foeId){const c=ST.chars[uid];if(!charOK(c)||c.hp<=0||!hakiOf(c).includes('predictive'))return null;const D=derive(c.build);const used=(c.res||{}).haki_predictive||0;if(used>=D.prof)return null;
  const f=ST.dm[foeId];if(!f||f.hp<=0)return null;const r=d20roll(0);const tot=r.v+D.atk;await put('chars/'+uid,{...ST.chars[uid],res:{...(ST.chars[uid].res||{}),haki_predictive:used+1}});
  if(r.v!==20&&(r.v===1||tot<f.ac))return`${c.build.name} sees it coming and strikes back (Predictive Strike) but misses.`;
  let dmg=sum(Array.from({length:D.n*(r.v===20?2:1)},()=>d(D.die)))+D.dmgMod;const ft=FOES[f.foe]||{};const dt=WDTYPE[c.build.weapon]||'slashing';if((ft.immune||[]).includes(dt))dmg=0;else if((ft.resist||[]).includes(dt))dmg=Math.floor(dmg/2);
  const nh=Math.max(0,f.hp-dmg);await setFoeHp(foeId,nh);if(nh===0)setTimeout(()=>koFoe(foeId),900);return`${c.build.name} saw it coming: Predictive Strike hits ${f.name} for ${dmg}!`}

    const flat=dd==='1';return{name,atk:prof+M(a),atkParts:[[a,M(a)],['Proficiency',prof]],dmg:flat?String(Math.max(0,1+M(a))):dd+(M(a)?fmt(M(a)):''),note:type+(fl.includes('f')?', finesse':'')+(fl.includes('r')?', ranged':'')}});
  const nAtk=(['fighter'].includes(b.cls)?(lvl>=20?4:lvl>=11?3:lvl>=5?2:1):(['barbarian','monk','paladin','ranger'].includes(b.cls)&&lvl>=5?2:1));

  return{lvl,prof,ab,abBase,asi,skills,saves,maxhp,hpParts,ac,acParts,init:partsSum(initParts),initParts,speed,res,feats,traits:[...(sp.traits||[])],speciesName:sp.name,clsName:cl.name+(b.subclass?` (${b.subclass})`:''),hd:cl.hd,attacks,nAtk,sneak,spell}}
function r5Validate(b){const errs=[];const cl=R5.classes[b.cls];const sp=R5.species[b.species];if(!String(b.name||'').trim())errs.push('Give your character a name.');if(!cl)errs.push('Pick a class.');if(!sp)errs.push('Pick a species.');

  return errs}

// ================= Sheet Table: character sheets and dice for a table with a human DM =================

function toast(t,ms){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms||2800)}
// "tap twice" instead of a confirm box (those are blocked inside Claude)

// ---------------- sync ----------------
const LSKEY='sheettable-local-v1';
function lsave(){if(!SH.solo)return;try{localStorage.setItem(LSKEY,JSON.stringify({state:SH.state,chars:SH.chars,log:SH.log,dm:SH.dm}))}catch(e){}}
function lload(){try{const v=JSON.parse(localStorage.getItem(LSKEY)||'null');if(v)Object.assign(SH,v)}catch(e){}}
const writing={};
async function put(path,data){const [c,id]=path.split('/');data=clone(data);
  if(c==='table')SH.state=data;else if(c==='chars')SH.chars[id]=data;else if(c==='dm')SH.dm[id]=data;
  if(SH.solo){lsave();render();return}
  if(writing[path]){writing[path].next=data;return}
  writing[path]={next:null};let body=data;
  while(body){try{await SH.db.doc(path).set(body)}catch(e){toast('Could not save ('+(e.code||e.message||'error')+'). Check your connection.')}body=writing[path].next;writing[path].next=null}
  delete writing[path]}
async function del(path){const [c,id]=path.split('/');if(c==='chars')delete SH.chars[id];if(c==='dm')delete SH.dm[id];if(SH.solo){lsave();render();return}try{await SH.db.doc(path).delete()}catch(e){toast('Could not delete.')}}
async function addLog(e){e.t=Date.now();if(SH.solo){SH.log.unshift({id:'l'+e.t+Math.random(),...e});SH.log=SH.log.slice(0,150);lsave();onLog([SH.log[0]]);render();return}
  try{await SH.db.collection('log').add(e)}catch(x){toast('Roll not shared ('+(x.code||'offline')+').')}}
const setState=patch=>put('table/state',{...SH.state,...patch});
const saveChar=(uid,patch)=>{const c=SH.chars[uid];if(!c)return;return put('chars/'+uid,{...c,...patch})};
const myChar=()=>SH.chars[SH.me]||null;
const isDM=()=>SH.owner&&(SH.asDM||!SH.solo&&!myChar());
async function boot(){
  let db=null,user=null;

  try{user=await claude.use('user')}catch(e){user=null}
  if(!db){SH.solo=true;SH.owner=true;SH.me='local-me';lload();SH.ready=true;render();return}
  SH.db=db;SH.owner=user?await user.isOwner():false;SH.me=user?await user.id():'anon';SH.asDM=SH.owner;
  const err=e=>console.warn('sync',e);
  db.doc('table/state').onSnapshot(s=>{SH.state=s.exists?s.data():{};SH.ready=true;hostTick();render()},err);
  db.collection('chars').onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());SH.chars=o;render()},err);
  db.collection('log').orderBy('t','desc').limit(120).onSnapshot(s=>{const fresh=s.docChanges().filter(c=>c.type==='added').map(c=>({id:c.doc.id,...c.doc.data()}));SH.log=s.docs.map(x=>({id:x.id,...x.data()}));onLog(fresh);render()},err);
  if(SH.owner)db.collection('dm').onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());SH.dm=o;render()},err);
  try{SH.room=await claude.use('room')}catch(e){SH.room=null}
  if(SH.room){const pres=()=>{try{SH.peers=SH.room.peers()||[]}catch(e){SH.peers=[]}render()};SH.room.onPeers(pres);pres();announce()}
  render()}
function announce(){if(!SH.room)return;const c=myChar();SH.room.presence({who:c?c.build.name:(SH.owner?'DM':'Player'),...(SH.owner?{host:true}:{})}).catch(()=>{})}
const online=uid=>SH.solo||uid===SH.me||SH.peers.some(p=>p.id===uid);

// ---------------- the normalised sheet numbers for both rulesets ----------------
function DV(c){const b=c.build;let D;
  if(b.rules==='5e')D=derive5(b);
  else{const o=derive(b);const cl=CLASSES[b.cls]||{};D={...o,hd:cl.hd||8,nAtk:o.attacks,
      attacks:[{name:o.weapon.name,atk:o.atk,atkParts:o.atkParts,dmg:`${o.n}d${o.die}${o.dmgMod?fmt(o.dmgMod):''}`,note:[...new Set([o.dieNote,o.weapon.note,o.ranged?`range ${o.range[0]*5}/${o.range[1]*5} ft`:`reach ${o.reach*5} ft`].filter(Boolean))].join(' · ')}],
      spell:o.spellDC?{ab:cl.ab,dc:o.spellDC,atk:o.spellAtk,slots:[],pact:null,prep:0}:null}}
  D.res={...D.res};for(const r of (c.cres||[]))D.res['c_'+r.id]={name:r.name,max:Math.max(1,+r.max||1),rest:r.rest||'long',custom:r.id};
  const ov=c.ovr||{};D.auto={maxhp:D.maxhp,ac:D.ac,speed:D.speed,init:D.init};
  for(const k of ['maxhp','ac','speed','init'])if(ov[k]!==undefined&&ov[k]!==''&&ov[k]!==null&&!isNaN(+ov[k]))D[k]=+ov[k];
  D.passive=10+D.skills.Perception.bonus;return D}
const charOK=c=>!!(c&&c.build&&c.build.name);
function newCharDoc(b){const c={build:b,hp:1,temp:0,res:{},cond:{},death:{s:0,f:0},inv:[],notes:'',spells:[],catk:[],cfeat:[],cres:[],ovr:{},t:Date.now()};
  if(b.rules==='5e'){c.gp=10;c.inv=[...(b.weps||[]).filter(k=>k!=='unarmed').map(k=>({name:R5.weapons[k][0],qty:1})),...(b.armor&&b.armor!=='none'?[{name:R5.armor[b.armor].name,qty:1}]:[]),...(b.shield?[{name:'Shield',qty:1}]:[]),{name:'Backpack',qty:1},{name:'Rations (days)',qty:5},{name:'Rope (50 ft)',qty:1},{name:'Torch',qty:5}]}
  else{c.berries=100000;c.inv=startingGear(b).map(g=>({name:g.name,qty:g.qty}))}
  c.hp=DV(c).maxhp;return c}

// ---------------- dice ----------------
function parseDice(expr){const out=[];let s=String(expr||'').replace(/\s+/g,'').toLowerCase();if(!s)return null;if(!/^[+-]/.test(s))s='+'+s;
  const re=/([+-])(\d*)d(\d+)|([+-])(\d+)/g;let m,used=0;while((m=re.exec(s))){used+=m[0].length;if(m[3])out.push({sign:m[1]==='-'?-1:1,n:Math.min(40,+(m[2]||1)),die:Math.min(1000,+m[3])});else out.push({sign:m[4]==='-'?-1:1,flat:+m[5]})}
  return used===s.length&&out.length?out:null}
function rollExprNow(expr,crit){const terms=parseDice(expr);if(!terms)return null;let total=0;const bits=[];
  for(const t of terms){if(t.flat!==undefined){total+=t.sign*t.flat;bits.push((t.sign<0?'−':'+')+t.flat)}
    else{const n=crit?t.n*2:t.n;const rs=Array.from({length:n},()=>d(t.die));total+=t.sign*sum(rs);bits.push(`${t.sign<0?'−':'+'}${n}d${t.die} (${rs.join(', ')})`)}}
  return{total:Math.max(0,total),detail:bits.join(' ').replace(/^\+/,'')}}
function who(uid){const c=SH.chars[uid];return c&&c.build?c.build.name:(uid===SH.me&&SH.owner?'DM':'Someone')}
// a d20 roll with the Adv/Dis switch; opts: {uid, follow, req, secret, kind}
async function rollD20(label,bonus,partsTxt,opts){opts=opts||{};const adv=opts.adv!==undefined?opts.adv:SH.adv;const a=d(20),b2=d(20);const nat=adv>0?Math.max(a,b2):adv<0?Math.min(a,b2):a;const total=nat+bonus;
  const detail=`d20 ${adv?`${adv>0?'adv':'dis'} (${a}, ${b2}) → `:''}${nat} ${partsTxt?'· '+partsTxt:(bonus?fmt(bonus):'')}`.trim();
  const e={by:SH.me,who:opts.name||who(opts.uid||SH.me),label,detail,total,nat,kind:opts.kind||'d20',...(adv?{adv}:{}),...(opts.req?{req:opts.req}:{}),...(opts.init?{init:opts.init}:{})};
  SH.adv=0;showRoll(e,opts.follow);if(opts.secret){await secretLog(e)}else await addLog(e);return e}
async function rollDmg(label,expr,opts){opts=opts||{};const r=rollExprNow(expr,opts.crit);if(!r){toast('Cannot roll "'+expr+'". Write dice like 2d6+3.');return null}
  const e={by:SH.me,who:opts.name||who(opts.uid||SH.me),label:label+(opts.crit?' (critical)':''),detail:r.detail,total:r.total,kind:opts.kind||'dmg'};
  showRoll(e);if(opts.secret)await secretLog(e);else await addLog(e);return e}
async function secretLog(e){const doc=SH.dm.rolls||{items:[]};await put('dm/rolls',{items:[{...e,t:Date.now()},...(doc.items||[])].slice(0,60)})}
let rollT=0;
function showRoll(e,follow){let el=q('#rollCard');if(!el){el=document.createElement('div');el.id='rollCard';document.body.appendChild(el)}
  const crit=e.kind!=='dmg'&&e.nat===20,fum=e.kind!=='dmg'&&e.nat===1;
  el.className='show'+(crit?' crit':fum?' fumble':'');
  el.innerHTML=`<div class="rc-l">${esc(e.who)} · ${esc(e.label)}</div><div class="rc-t">${e.total}</div><div class="rc-d">${esc(e.detail)}${crit?' · <b>NAT 20</b>':fum?' · <b>NAT 1</b>':''}</div>
    ${follow?`<div class="rc-f">${follow.map((f,i)=>`<button type="button" class="btn sm" data-rcf="${i}">${esc(f.t)}</button>`).join('')}</div>`:''}<button type="button" class="rc-x" aria-label="Close">✕</button>`;
  qa('[data-rcf]',el).forEach(b=>b.onclick=()=>{follow[+b.dataset.rcf].run(crit)});q('.rc-x',el).onclick=()=>{el.className=''};
  clearTimeout(rollT);rollT=setTimeout(()=>{el.className=''},follow?9000:4500)}
// other people's rolls pop up as a small line
function onLog(fresh){const boot=!SH.seenLog;const newest=fresh.reduce((m,e)=>Math.max(m,e.t||0),0);
  if(!boot)for(const e of fresh){if(e.by===SH.me||(e.t||0)<=SH.seenLog)continue;if(e.quiet)continue;if(e.kind==='note')toast(e.label,e.read?9000:3500);else toast(`${e.who}: ${e.label} → ${e.total}${e.nat===20?' (nat 20!)':e.nat===1?' (nat 1)':''}`,3500)}
  SH.seenLog=Math.max(SH.seenLog||1,newest);hostTick()}

// ---------------- sheet actions (uid = whose sheet: your own, or any sheet if you are the DM) ----------------
const canEdit=uid=>uid===SH.me||SH.owner;
function hpChange(uid,delta,note){const c=SH.chars[uid];if(!c)return;const D=DV(c);let hp=c.hp,temp=c.temp||0;
  const patch={};let extra='';
  if(delta<0){let dmg=-delta;const t=Math.min(temp,dmg);temp-=t;dmg-=t;
    if(c.hp<=0&&dmg>0&&!c.dead){const dt={...(c.death||{s:0,f:0})};dt.f=Math.min(3,dt.f+1);patch.death=dt;patch.stable=false;if(dt.f>=3)patch.dead=true;extra=dt.f>=3?' · DEAD':' · a failed death save'}
    else if(dmg-hp>=D.maxhp&&hp>0){patch.dead=true;extra=' · killed outright (massive damage)'}
    hp=Math.max(0,hp-dmg)}else hp=Math.min(D.maxhp,hp+delta);
  Object.assign(patch,{hp,temp});if(hp>0&&c.hp<=0){patch.death={s:0,f:0};patch.stable=false;patch.dead=false}
  saveChar(uid,patch);addLog({by:SH.me,who:who(uid),kind:'note',label:`${who(uid)} ${delta<0?'takes '+(-delta)+' damage':'heals '+delta}${note?' ('+note+')':''}: ${hp}/${D.maxhp} HP${hp<=0&&!extra?' · DOWN':''}${extra}`,total:'',quiet:hp>0})}
function restFor(uid,kind){const c=SH.chars[uid];if(!c)return;const D=DV(c);const res={...(c.res||{})};
  for(const [k,r] of Object.entries(D.res)){const rest=String(r.rest||'');if(kind==='long'||rest.startsWith('short')||rest==='turn')delete res[k]}
  if(kind==='long'){for(const k of Object.keys(res))if(/^slot\d|^pact$|^fruit$|^hk_/.test(k))delete res[k];
    const used=res.hd||0;if(is5(c))res.hd=Math.max(0,used-Math.max(1,Math.floor(D.lvl/2)));else delete res.hd;
    saveChar(uid,{hp:D.maxhp,temp:0,res,death:{s:0,f:0},stable:false,exh:Math.max(0,(c.exh||0)-1)})}
  else{if(D.spell&&D.spell.pact)delete res.pact;saveChar(uid,{res})}}
function spendHD(uid){const c=SH.chars[uid];const D=DV(c);const used=(c.res||{}).hd||0;if(used>=D.lvl){toast('No hit dice left.');return}
  const r=d(D.hd);const heal=Math.max(1,r+mod(D.ab.CON));const hp=Math.min(D.maxhp,c.hp+heal);saveChar(uid,{hp,res:{...(c.res||{}),hd:used+1}});
  const e={by:SH.me,who:who(uid),label:'Hit die',detail:`d${D.hd} (${r}) ${fmt(mod(D.ab.CON))} CON`,total:heal,kind:'dmg'};showRoll(e);addLog(e)}
async function deathSave(uid){const c=SH.chars[uid];const e=await rollD20('Death save',0,'',{uid,adv:0});const dt={...(c.death||{s:0,f:0})};let patch={};
  if(e.nat===20)patch={hp:1,death:{s:0,f:0},stable:false};else{if(e.nat===1)dt.f+=2;else if(e.nat>=10)dt.s+=1;else dt.f+=1;patch={death:dt};if(dt.f>=3)patch.dead=true;else if(dt.s>=3){patch.stable=true;patch.death={s:0,f:0}}}
  saveChar(uid,patch)}

// ---------------- the host keeps the table: initiative rolls land in the order, the session snapshot ----------------
function hostTick(){if(!SH.owner||!SH.ready)return;const st=SH.state;const ini=st.init;
  if(ini&&ini.on&&ini.req){let ch=false;const order=[...(ini.order||[])];
    for(const e of SH.log){if(e.init!==ini.req)continue;const uid=e.by;if(!SH.chars[uid])continue;const have=order.find(o=>o.pc===uid);if(have){if(have.t>=e.t)continue;have.v=e.total;have.t=e.t;ch=true}else{order.push({id:'pc_'+uid,name:SH.chars[uid].build.name,v:e.total,pc:uid,t:e.t});ch=true}}
    if(ch){const cur=order[ini.turn]&&ini.started?order[ini.turn].id:null;order.sort((a,b)=>b.v-a.v);put('table/state',{...st,init:{...ini,order,turn:cur?Math.max(0,order.findIndex(o=>o.id===cur)):0}})}}}

// ================= the character sheet (phone first): Main · Skills · Actions · Features · Bag · Table =================
const TABS=[['main','❤','Main'],['skills','🎯','Skills'],['actions','⚔','Actions'],['feats','📜','Features'],['bag','🎒','Bag'],['table','🎲','Table']];
const ini2=n=>{const w=String(n||'?').trim().split(/\s+/);return((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()};

function pipsHTML(uid,key,max,used,title){if(max>10)return`<span class="ctr"><button type="button" class="btn xs" data-a="resAdj" data-u="${uid}" data-k="${key}" data-d="1" aria-label="Use one ${esc(title)}">−</button><b>${Math.max(0,max-used)}</b>/${max>=99?'∞':max}<button type="button" class="btn xs" data-a="resAdj" data-u="${uid}" data-k="${key}" data-d="-1" aria-label="Give one back">+</button></span>`;

function sheetHTML(uid){const c=SH.chars[uid];const D=DV(c);const b=c.build;const mine=uid===SH.me;const ed=canEdit(uid);const tab=SH.tab;
  const wide=window.innerWidth>=1000;const second=wide?(tab==='main'?'skills':tab):null;
  const page=t=>t==='main'?pgMain(uid,c,D):t==='skills'?pgSkills(uid,c,D):t==='actions'?pgActions(uid,c,D):t==='feats'?pgFeats(uid,c,D):t==='bag'?pgBag(uid,c,D):pgTable(uid);

    ${levelAllowed(c)&&ed?`<button type="button" class="btn pri sm" data-a="luOpen" data-u="${uid}">⬆ Level ${b.level+1}</button>`:''}${ed?`<button type="button" class="btn sm" data-a="editOpen" data-u="${uid}" aria-label="Edit character">✎</button>`:''}</div>
  <div class="pages ${wide&&!SH.printAll?'wide':''}">${SH.printAll?['main','skills','actions','feats','bag'].map(t=>`<section class="pg">${page(t)}</section>`).join(''):wide?`<section class="pg">${pgMain(uid,c,D)}</section><section class="pg">${page(second)}</section>`:`<section class="pg">${page(tab)}</section>`}</div>`}

function pgMain(uid,c,D){const ed=canEdit(uid);const down=c.hp<=0;const hdUsed=(c.res||{}).hd||0;const conds=Object.keys(c.cond||{}).filter(k=>c.cond[k]);

function partyHTML(){const showHP=SH.state.showHP!==false||SH.owner;return Object.entries(SH.chars).filter(([,c])=>charOK(c)).map(([u,c])=>{const D=DV(c);const conds=Object.keys(c.cond||{}).filter(k=>c.cond[k]);

function logHTML(n){const L=SH.log.slice(0,n||60);return L.map(e=>e.kind==='note'?`<div class="lg note ${e.read?'read':''}">${esc(e.label)}</div>`:`<div class="lg ${e.nat===20?'crit':e.nat===1?'fum':''}"><div><b>${esc(e.who)}</b> ${esc(e.label)}<small>${esc(e.detail||'')}</small></div><span>${e.total}</span></div>`).join('')||'<p class="hint">No rolls yet.</p>'}

function initStripHTML(){const ini=SH.state.init;if(!ini||!ini.on)return'';const order=ini.order||[];const cur=ini.started?order[ini.turn]:null;const myTurn=cur&&cur.pc===SH.me;
  return`<div class="inits ${myTurn?'mine':''}"><span class="rd">${ini.started?'Round '+(ini.round||1):'Initiative'}</span><div class="ord">${order.map((o,i)=>`<span class="${ini.started&&i===ini.turn?'cur':''} ${o.pc?'pc':'foe'}">${esc(o.pc||SH.owner||!o.hide?o.name:'Enemy')}${SH.owner?' '+o.v:''}</span>`).join('')||'<span>waiting for rolls…</span>'}</div>

function reqBannerHTML(){const out=[];const st=SH.state;const c=myChar();if(!c||isDM())return'';

// ================= making a character, and levelling up =================
const R5_ARMOR_DEFAULT={barbarian:'none',bard:'leather',cleric:'scale',druid:'leather',fighter:'chain',monk:'none',paladin:'chain',ranger:'scale',rogue:'leather',sorcerer:'none',warlock:'leather',wizard:'none'};
const R5_SHIELD_DEFAULT={cleric:true,druid:true,paladin:true};
function opDefault(){const b=defaultBuild();b.rules='op';b.poolIdx={};ABS.forEach((a,i)=>b.poolIdx[a]=i);return b}
function r5New(){const b=r5Default();b.method='array';b.pool=STD_ARRAY.slice();b.poolIdx={};ABS.forEach((a,i)=>b.poolIdx[a]=i);r5ClassDefaults(b);return b}
function r5ClassDefaults(b){const cl=R5.classes[b.cls];b.classSkills=[];b.expertise=[];b.weps=(cl.start||[]).slice();b.armor=R5_ARMOR_DEFAULT[b.cls]||'none';b.shield=!!R5_SHIELD_DEFAULT[b.cls]}
function opClassDefaults(b){b.classSkills=[];b.expertise=[];b.weapon=weaponsFor(b)[0];b.subclass=null}
function openBuilder(uid){const c=SH.chars[uid];let b;if(c&&c.build)b=clone(c.build);else{b=RULES()==='5e'?r5New():opDefault();const sl=+SH.state.startLevel||1;if(sl>1)b.level=Math.min(sl,b.rules==='5e'?20:10)}
  if(!b.pool){b.method='manual'}SH.edit={uid,b,isNew:!(c&&c.build),errs:[]};render()}
function applyPool(b){if(b.method==='manual')return;for(const a of ABS)b.scores[a]=b.pool[b.poolIdx[a]]}
function expCount(b){if(b.rules==='5e'){const e=(R5.classes[b.cls]||{}).expertise||{};return Object.entries(e).filter(([L])=>+L<=b.level).reduce((s,[,n])=>s+n,0)}return(CLASSES[b.cls]||{}).expertise||0}
function chipsHTML(field,all,picked,max){return`<div class="chipset" data-f="${field}" data-max="${max}">${all.map(s=>`<button type="button" class="chip tog ${picked.includes(s)?'on':''}" data-a="bChip" data-f="${field}" data-v="${esc(s)}" data-max="${max}">${esc(s)}</button>`).join('')}</div>`}
function builderHTML(){const E=SH.edit;const b=E.b;const r5=b.rules==='5e';const SP=r5?R5.species:SPECIES;const CL=r5?R5.classes:CLASSES;const sp=SP[b.species];const cl=CL[b.cls];
  let D=null;try{D=r5?derive5(b):derive(b)}catch(e){}
  const picks=r5?(b.flex?[2,1]:(sp.pick||[])):asiOf(b).picks;const sub=!r5&&sp.subs?sp.subs[b.sub]:null;
  const profNow=D?Object.keys(D.skills).filter(s=>D.skills[s].prof):[];const nExp=expCount(b);
  const subLvl=r5?cl.subLvl:c2SubLevel(b.cls);
  return`<div class="builder"><div class="hero"><div class="hn"><h1>${E.isNew?'New character':'Edit '+esc(b.name||'character')}</h1><div class="sub">${r5?'D&D 5e':'One Piece · Dungeons & Devil Fruits'}</div></div><button type="button" class="btn sm" data-a="bCancel">Cancel</button></div>

    ${U.mode==='feat'?(r5?`<input data-c="luText" data-f="feat" value="${esc(U.feat||'')}" maxlength="40" placeholder="Feat name (add what it does under Custom features)">`:`<select data-c="luText" data-f="feat"><option value="">Choose…</option>${featOpts.map(([k,f])=>`<option value="${k}" ${U.feat===k?'selected':''}>${esc(f.name)}: ${esc(f.desc)}</option>`).join('')}</select>`)

function luSave(){const U=SH.lu;const c=SH.chars[U.uid];const b=clone(c.build);const I=luInfo(c);const errs=[];
  if(!U.hp)errs.push('Roll or take the average for your hit points.');if(I.needSub&&!String(U.sub||'').trim())errs.push('Choose your '+I.subName.toLowerCase()+'.');

  if(I.exp&&(U.exp||[]).length!==I.exp)errs.push(`Choose ${I.exp} Expertise skills.`);
  if(errs.length){U.errs=errs;render();return}
  const oldMax=DV(c).maxhp;b.level=I.L;b.hpRolls={...(b.hpRolls||{}),[I.L]:U.hp};if(I.needSub)b.subclass=String(U.sub).trim();

  const nc={...c,build:b};const gain=Math.max(0,DV(nc).maxhp-oldMax);nc.hp=c.hp+gain;put('chars/'+U.uid,nc);

function sessionDiff(){const s=SH.dm.session;if(!s)return'';const rows=[];for(const [u,c] of Object.entries(SH.chars)){if(!charOK(c))continue;const o=(s.chars||{})[u];if(!o){rows.push(`<p><b>${esc(c.build.name)}</b> joined.</p>`);continue}const bits=[];

  const o=order[t];if(o)addLog({by:SH.me,who:'DM',kind:'note',label:`▶ ${o.pc||!o.hide?o.name:'An enemy'}'s turn (round ${r})`,total:''})}

    const id=uidNew();const dc=Math.round(num('rqDC'));if(dc>0)put('dm/req',{id,dc});setState({req:{id,kind,key,label:reqLabelOf(kind,key),adv:+val('rqAdv')||0,for:who2.length===all?'all':who2,t:Date.now()}})},

  oHide(b){const ini=initOf();setInit({order:(ini.order||[]).map(o=>o.id===b.dataset.k?{...o,hide:!o.hide}:o)})},

  sessStart(b){if(SH.dm.session&&!tapTwice(b,'Tap again: start a new session'))return;const chars={};for(const [u,c] of Object.entries(SH.chars))if(charOK(c))chars[u]={lvl:c.build.level,hp:c.hp,money:moneyOf(c),inv:Object.fromEntries((c.inv||[]).map(i=>[i.name,i.qty]))};put('dm/session',{t:Date.now(),chars});addLog({by:SH.me,who:'DM',kind:'note',label:'📖 The session begins.',total:''})},
  async copyLink(b){try{await navigator.clipboard.writeText(b.dataset.k);b.textContent='Copied!'}catch(e){const i=b.parentElement.querySelector('input');if(i){i.select();toast('Copy the selected link.')}}}

// ================= campaign prep: the DM plans scenes, encounters, NPCs and loot before the session =================
// Everything here lives in the DM's private notes (players never receive it) until the DM reads a scene aloud,

const campOf=()=>({name:'',pitch:'',scenes:[],encs:[],npcs:[],loot:[],...(SH.dm.camp||{})});

  <div class="row wrap"><button type="button" class="btn" data-a="cpExport">⬇ Download the campaign</button><label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">⬆ Load from a file<input type="file" accept="application/json,.json" data-c="cpImport" hidden></label></div>`}
// add planned or typed-in enemies to the running fight (starting one if needed)
function addMons(list){if(!initOf().on)ACT.fightStart();const ini=initOf();const order=[...(ini.order||[])];const cur=ini.started&&order[ini.turn]?order[ini.turn].id:null;const mons={...((SH.dm.enc||{}).mons||{})};
  for(const m of list){const name=String(m.name||'Enemy');const n=Math.max(1,Math.min(12,+m.n||1));const have=order.filter(o=>!o.pc&&o.name.replace(/ \d+$/,'')===name).length;
    for(let i=0;i<n;i++){const id='m_'+uidNew()+i;const nm=n>1||have?`${name} ${have+i+1}`:name;mons[id]={name:nm,hp:m.hp,max:m.hp,ac:m.ac||null,...(m.atk!==null&&m.atk!==undefined&&m.atk!==''?{atk:+m.atk,dmg:m.dmg||''}:{})};order.push({id,name:nm,v:d(20)+(+m.init||0),hide:!!m.hide})}}
  order.sort((a,b)=>b.v-a.v);put('dm/enc',{mons});setInit({order,turn:cur?Math.max(0,order.findIndex(o=>o.id===cur)):0})}
Object.assign(ACT,{
  cpAdd(b){const f=b.dataset.f;const inp={scenes:'cpSN',encs:'cpEN',npcs:'cpNN',loot:'cpLN'}[f];const name=val(inp).trim();if(!name){toast('Give it a name first.');return}
    campEdit(c=>{c[f].push(f==='scenes'?{id:uidNew(),title:name,read:'',notes:'',enc:''}:f==='encs'?{id:uidNew(),name,notes:'',mons:[]}:f==='npcs'?{id:uidNew(),name,role:'',notes:''}:{id:uidNew(),name,money:0,items:[]})});const e=document.getElementById(inp);if(e)e.value='';render(true);const all=qa('.feats details[data-dk]');const nid=campOf()[f].slice(-1)[0].id;const nd=all.find(x=>x.dataset.dk===nid);if(nd)nd.open=true},
  cpDel(b){if(!tapTwice(b,'Tap again: delete'))return;campEdit(c=>{c[b.dataset.f]=c[b.dataset.f].filter(x=>x.id!==b.dataset.k)})},
  cpDone(b){campEdit(c=>{const s=byId(c.scenes,b.dataset.k);s.done=!s.done})},
  cpUp(b){campEdit(c=>{const i=c.scenes.findIndex(x=>x.id===b.dataset.k);if(i>0)[c.scenes[i-1],c.scenes[i]]=[c.scenes[i],c.scenes[i-1]]})},
  cpRead(b){const s=byId(campOf().scenes,b.dataset.k);if(s&&s.read)addLog({by:SH.me,who:'DM',kind:'note',read:true,label:'📣 '+s.read,total:''});toast('Sent to everyone\'s log.')},
  cpMonAdd(b){const k=b.dataset.k;const name=val('cmN_'+k).trim();const hp=Math.round(num('cmH_'+k));if(!name||hp<1){toast('An enemy needs a name and HP.');return}const dmg=val('cmD_'+k).trim();if(dmg&&!parseDice(dmg)){toast('Write damage like 1d8+2.');return}const atk=val('cmT_'+k);
    campEdit(c=>{byId(c.encs,k).mons.push({name,n:Math.max(1,Math.min(12,Math.round(num('cmC_'+k))||1)),hp,ac:Math.round(num('cmA_'+k))||null,init:Math.round(num('cmI_'+k))||0,atk:atk===''?null:Math.round(+atk),dmg,hide:!!(q('#cmX_'+k)&&q('#cmX_'+k).checked)})});render(true)},
  cpMonDel(b){campEdit(c=>{byId(c.encs,b.dataset.k).mons.splice(+b.dataset.i,1)})},
  cpDup(b){campEdit(c=>{const e=byId(c.encs,b.dataset.k);c.encs.push({...clone(e),id:uidNew(),name:e.name+' (copy)'})})},
  cpRun(b){const e=byId(campOf().encs,b.dataset.k);if(!e||!e.mons.length){toast('This encounter has no enemies yet.');return}if(initOf().on&&!tapTwice(b,'A fight is running. Tap again: add them to it'))return;addMons(e.mons);SH.dmTab='fight';render(true);window.scrollTo(0,0)},
  cpItemAdd(b){const k=b.dataset.k;const name=val('clN_'+k).trim();if(!name)return;campEdit(c=>{byId(c.loot,k).items.push({name,qty:Math.max(1,Math.round(num('clQ_'+k))||1)})});render(true)},
  cpItemDel(b){campEdit(c=>{byId(c.loot,b.dataset.k).items.splice(+b.dataset.i,1)})},
  cpGive(b){const k=b.dataset.k;const l=byId(campOf().loot,k);if(!l)return;if(l.given&&!tapTwice(b,'Already handed out. Tap again: give it once more'))return;const to=val('clTo_'+k);const pcs=Object.entries(SH.chars).filter(([,c])=>charOK(c));const targets=to==='all'?pcs:pcs.filter(([u])=>u===to);if(!targets.length)return;
    const share=(+l.money||0)/targets.length;targets.forEach(([u,c],i)=>{const patch={};if(share)Object.assign(patch,is5(c)?{gp:Math.round((moneyOf(c)+share)*100)/100}:{berries:Math.round(moneyOf(c)+share)});
      if(i===0&&l.items.length){const inv=(c.inv||[]).map(x=>({...x}));for(const it of l.items){const ex=inv.find(x=>x.name.toLowerCase()===it.name.toLowerCase());if(ex)ex.qty+=it.qty;else inv.push({name:it.name,qty:it.qty})}patch.inv=inv}saveChar(u,patch)});
    const bits=[];if(l.money)bits.push(`${Number(l.money).toLocaleString('en-US')} ${RULES()==='5e'?'gp':'Berries'}${targets.length>1?' (split)':''}`);for(const it of l.items)bits.push(`${it.qty>1?it.qty+' × ':''}${it.name}`);
    addLog({by:SH.me,who:'DM',kind:'note',label:`🎁 ${l.name}: ${targets.length>1?'the party':targets[0][1].build.name} gets ${bits.join(', ')||'nothing'}.${l.items.length&&targets.length>1?' Items go to '+targets[0][1].build.name+'.':''}`,total:''});campEdit(c=>{byId(c.loot,k).given=true})},
  cpExport(){const C=campOf();const blob=new Blob([JSON.stringify({sheetTableCampaign:1,...C},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(C.name||'campaign').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},
  mAtk(b){const m=((SH.dm.enc||{}).mons||{})[b.dataset.k];const o=(initOf().order||[]).find(x=>x.id===b.dataset.k);if(!m||!o)return;const nm=o.hide?'Enemy':m.name;rollD20(nm+' attacks',m.atk,fmt(m.atk),{name:nm,follow:m.dmg?[{t:'Damage '+m.dmg,run:crit=>rollDmg(nm+' damage',m.dmg,{name:nm,crit})}]:null})},
  themeOpen(){SH.pick=true;render(true);window.scrollTo(0,0)},themeClose(){SH.pick=false;render(true)},
  themeSet(b){try{localStorage.setItem('sht-theme',b.dataset.k)}catch(e){}SH.myTheme=b.dataset.k;render(true)},
  themeTable(b){setState({theme:curTheme()});toast('Players who have not picked a look now get this one.')}
});
Object.assign(CHG,{
  cpField(e){campEdit(c=>{c[e.dataset.f]=e.value})},
  cpScene(e){campEdit(c=>{byId(c.scenes,e.dataset.k)[e.dataset.f]=e.value})},
  cpEnc(e){campEdit(c=>{byId(c.encs,e.dataset.k)[e.dataset.f]=e.value})},
  cpNpc(e){campEdit(c=>{byId(c.npcs,e.dataset.k)[e.dataset.f]=e.value})},
  cpLoot(e){campEdit(c=>{byId(c.loot,e.dataset.k)[e.dataset.f]=Math.max(0,+e.value||0)})},
  cpImport(e){const f=e.files&&e.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.sheetTableCampaign||!Array.isArray(o.scenes))throw 0;const C={name:String(o.name||''),pitch:String(o.pitch||''),scenes:o.scenes||[],encs:o.encs||[],npcs:o.npcs||[],loot:o.loot||[]};saveCamp(C);toast('Campaign loaded.');render(true)}catch(x){toast('That file is not a Sheet Table campaign.')}};r.readAsText(f)}
});
// ================= looks: seven skins, picked per device (the DM can set the table's default) =================
const THEMES=[['plain','Plain','Clean and quiet. Follows your phone\'s light or dark mode.'],['chart','Sea Chart','Old parchment, ink and red wax.'],['grandline','Grand Line','Deep navy and pirate gold.'],['wanted','Wanted Poster','Sun-bleached paper, heavy black type.'],
  ['tavern','Tavern','Dark wood and lantern light.'],['arcane','Arcane','Midnight purple with glowing runes.'],['manga','Manga','Black ink, white paper, loud yellow.']];
function curTheme(){if(SH.myTheme===undefined){try{SH.myTheme=localStorage.getItem('sht-theme')||''}catch(e){SH.myTheme=''}}const t=SH.myTheme||SH.state.theme||'plain';return THEMES.some(x=>x[0]===t)?t:'plain'}
function applyTheme(){const t=curTheme();if(document.documentElement.dataset.theme!==t)document.documentElement.dataset.theme=t}
function themePickHTML(){const cur=curTheme();return`<div class="builder"><div class="hero"><div class="hn"><h1>Pick a look</h1><div class="sub">Only changes this device${SH.owner?'. You can also make it the table\'s default.':'.'}</div></div><button type="button" class="btn sm" data-a="themeClose">Done</button></div>
  <div class="thgrid">${THEMES.map(([k,n,dsc])=>`<button type="button" class="thprev ${cur===k?'sel':''}" data-theme="${k}" data-a="themeSet" data-k="${k}"><span class="th-h">${esc(n)}</span><span class="th-hp"><b>27</b> / 34 HP</span><span class="th-bar"><i></i></span><span class="th-row"><span class="th-btn">Attack +5</span><span class="th-chip">Stealth +7</span></span><span class="th-d">${esc(dsc)}</span></button>`).join('')}</div>
  ${SH.owner&&!SH.solo?`<button type="button" class="btn big" data-a="themeTable">Use "${esc(THEMES.find(t=>t[0]===cur)[1])}" as the table's default</button>`:''}</div>`}
